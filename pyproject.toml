[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wolfpaw"
version = "0.0.1"
description = "A careful, capable, general-purpose AI worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "email-validator>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
langsmith = ["langsmith>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wolfpaw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
