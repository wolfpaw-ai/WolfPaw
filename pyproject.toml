[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wolfpaw"
version = "0.0.1"
description = "A careful, capable, general-purpose AI worker."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dmitri Wolf" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "email-validator>=2.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "readability-lxml>=0.8",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "python-pptx>=1.0",
    "arq>=0.26",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
s3 = ["boto3>=1.34"]
ses = ["boto3>=1.34"]
docker = ["docker>=7.0"]
e2b = ["e2b-code-interpreter>=1.0"]
pdf = ["weasyprint>=62"]

[tool.hatch.build.targets.wheel]
packages = ["src/wolfpaw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
