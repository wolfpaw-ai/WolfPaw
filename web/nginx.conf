# nginx config for the wolfpaw web container.
#
# Two jobs:
#   1. Serve the Vite-built SPA. React Router uses HTML5 history mode, so
#      unknown paths must fall back to /index.html for client-side routing.
#   2. Proxy every API path to the backend `app` service. Same shape as
#      web/vite.config.ts' dev proxy — keeps the browser on one origin so
#      the session cookie (samesite=lax) and CORS stay simple.
#
# SSE: the chat endpoint streams Server-Sent Events. nginx proxy_buffering
# must be off, and the connection kept open for the duration of the stream.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static files first — cache aggressively, the Vite build fingerprints
    # filenames so we can do this safely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy. Order matters: these must precede the SPA fallback.
    location ~ ^/(auth|channels|workspace|tasks|schedules|usage|me|health) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer, keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA fallback — any non-asset, non-API path serves the app shell so
    # React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
